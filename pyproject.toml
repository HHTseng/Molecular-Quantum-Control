[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-molecule-gnn-rlqls"
version = "0.2.0"
description = "Multi-molecule Gymnasium/PyTorch GNN reinforcement-learning quantum-logic spectroscopy"
requires-python = ">=3.10"
dependencies = [
  "gymnasium==1.3.0",
  "numpy>=2.0,<3",
  "scipy>=1.13",
  "torch>=2.5",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
physics = ["qutip>=5.3.0"]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
